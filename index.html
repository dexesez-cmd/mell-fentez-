<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Видеоредактор</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0d0d0d"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
/* ===== Стили: тёмная тема, бирюзовый акцент ===== */
:root{color-scheme:dark;--bg:#0d0d0d;--p:#1a1a1a;--ac:#4fd1e5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:#eee;font:14px system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100%;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{min-height:44px;min-width:44px;border:0;border-radius:12px;background:var(--p);color:#eee;font:inherit}
button:active{filter:brightness(1.5)}
#top{height:56px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 8px}
#exp{background:var(--ac);color:#000;font-weight:700;padding:0 18px}
#pv{flex:0 0 40%;min-height:0;display:flex;align-items:center;justify-content:center;background:#050505}
#ctl{height:52px;flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 8px}
#ctl>div:last-child{text-align:right}
#play{background:var(--ac);color:#000;font-size:20px;width:56px;border-radius:50%}
#tl{flex:1;min-height:0;position:relative;border-top:1px solid #222}
#lbl{position:absolute;left:0;top:22px;width:44px}
#lbl div{height:40px;display:flex;align-items:center;justify-content:center;font-size:16px;background:var(--p);border-bottom:1px solid var(--bg)}
#area{position:absolute;left:44px;right:0;top:0;bottom:0;overflow:hidden;touch-action:none;background:repeating-linear-gradient(#141414 0 40px,#1b1b1b 40px 80px) 0 22px}
#rl{position:absolute;left:0;top:0;height:22px}
#lw{position:absolute;left:0;right:0;top:22px;bottom:0;overflow:hidden}#lane{position:absolute;left:0;top:0;width:1px}
#ph{position:absolute;left:calc(44px + (100% - 44px)/2 - 1px);top:0;bottom:0;width:2px;background:#fff;pointer-events:none;z-index:3}
#ph.sn{background:var(--ac);box-shadow:0 0 8px var(--ac)}
.clip{position:absolute;height:34px;border-radius:8px;background:#2c3e50 left center/auto 100% repeat-x;font-size:11px;white-space:nowrap;overflow:hidden}
.clip span{position:absolute;left:0;top:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;background:#0009;padding:1px 5px}
.t1{background-color:#3b4a6b}.t2{background-color:#1f5a3a}.t3{background-color:#7b3fa0}.t4{background-color:#8a5a1f}
.clip.sel{overflow:visible;outline:2px solid #fff}
.h{position:absolute;top:0;bottom:0;width:14px;background:#fff;border-radius:6px}
.h.l{left:-3px}.h.r{right:-3px}
.add{position:absolute;width:34px;height:34px;border-radius:8px;background:var(--ac);color:#000;font-size:22px;text-align:center;line-height:34px}
#tb{flex:none;height:72px;display:flex;gap:4px;overflow-x:auto;padding:4px;background:var(--bg);position:relative;z-index:6;scrollbar-width:none}
#tb::-webkit-scrollbar{display:none}
#tb button{flex:none;width:66px;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;background:none}
#tb button b{font-size:22px;font-weight:400}
/* Шторка снизу: максимум 40% высоты, выезжает из-за нижней строки */
#sh{position:fixed;left:0;right:0;bottom:calc(72px + env(safe-area-inset-bottom));max-height:40vh;overflow:auto;background:#242424;border-radius:16px 16px 0 0;padding:0 12px 8px;transform:translateY(130%);transition:transform .2s;z-index:5;pointer-events:none}
#sh.open{transform:none;pointer-events:auto}
#grip{height:22px;display:flex;justify-content:center}
#grip::before{content:'';width:36px;height:4px;margin-top:9px;border-radius:2px;background:#666}
#shh{font-weight:600;margin-bottom:6px}
#shf{display:flex;justify-content:space-between;margin-top:8px}
.rt{margin:4px;padding:0 20px}.rt.on{background:var(--ac);color:#000}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:90%;background:#333;padding:10px 16px;border-radius:12px;opacity:0;transition:opacity .2s;z-index:70;pointer-events:none;text-align:center}
/* ===== Оформление как в CapCut ===== */
i{display:flex;font-style:normal}
svg{display:block;flex:none}
.ib{background:none;border-radius:0;display:flex;align-items:center;justify-content:center;padding:0}
#top{height:52px;padding:0 6px}
#top>div{display:flex;align-items:center;gap:8px}
#rs,#exp{min-height:36px;height:36px;min-width:0;border-radius:10px;font-size:14px;display:flex;align-items:center}
#rs{background:#2a2a2a;padding:0 8px 0 12px;gap:2px;font-weight:600}
#exp{padding:0 16px}
#pv{background:#0d0d0d}
#ctl{height:48px}
#ctl>div{display:flex;align-items:center}
#ctl>div:last-child{justify-content:flex-end}
#play{background:none;border-radius:0;width:56px}
#tm{margin-left:4px;font-size:12px;color:#8a8a8a}
#tm b{color:#fff;font-weight:400}
#sn{flex-direction:column;gap:1px}
#sn span{font-size:10px;line-height:1}
#sn.off{opacity:.4}
#tl{border-top:0}
#lbl{width:68px;display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:4px}
#mu{flex-direction:column;width:64px;gap:2px;white-space:nowrap}
#mu span{font-size:12px}
#lbl #cov{position:relative;width:52px;height:52px;border:0;border-radius:6px;background:#222 center/cover;flex-direction:column;justify-content:flex-end;align-items:center}
#cov i{position:absolute;top:3px;right:3px}
#cov span{width:100%;text-align:center;font-size:12px;background:#0007;border-radius:0 0 6px 6px}
#area{left:68px;background:#0d0d0d}
#ph{left:calc(68px + (100% - 68px)*.45 - 1px)}
.clip{border-radius:6px;font-size:12px}
.clip span{background:none;padding:0 6px;line-height:28px}
.t2{background-color:#1d3f4d}.t3{background-color:#5a4524}
.h{width:12px;background:#fff;border-radius:5px}
.add{width:40px;height:40px;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;line-height:1}
.hint{position:absolute;left:0;height:28px;padding:0 10px;display:flex;align-items:center;gap:6px;border-radius:6px;background:#1a1a1a;color:#8a8a8a;font-size:12px;white-space:nowrap}
#tb button{width:72px;gap:4px;font-size:12px;color:#fff}
#tb button b{display:flex}
/* ===== Библиотека футажей ===== */
#lib{position:fixed;left:0;right:0;bottom:calc(72px + env(safe-area-inset-bottom));height:70vh;background:#1a1a1a;border-radius:16px 16px 0 0;transform:translateY(130%);transition:transform .2s;z-index:5;display:flex;flex-direction:column;padding:10px 10px 0;pointer-events:none}
#lib.open{transform:none;pointer-events:auto}
#lh{display:flex;gap:6px;align-items:center}
#lq,#mc input{height:40px;border:0;border-radius:12px;background:#2a2a2a;color:#fff;padding:0 12px;font:inherit;user-select:text;-webkit-user-select:text}
#lq{flex:1;min-width:0}
#lch{display:flex;gap:6px;overflow-x:auto;padding:8px 0;scrollbar-width:none;flex:none}
.ch{flex:none;min-height:32px;padding:0 12px;border-radius:16px;background:#2a2a2a;font-size:12px}
.ch.on,.pri{background:var(--ac);color:#000;font-weight:600}
#lg{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;align-content:start}
#lg .emp{grid-column:1/4;display:flex;flex-direction:column;align-items:center;gap:12px;padding:30px 0;color:#8a8a8a}
.tile{position:relative;aspect-ratio:1;border-radius:6px;background:#2a2a2a center/cover;overflow:hidden;font-size:12px;display:flex;align-items:center;justify-content:center}
.tile span{position:absolute;padding:2px 5px;background:#000a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tile .n{left:0;right:0;bottom:0}.tile .d{top:0;left:0;border-radius:0 0 6px 0}
#ls{flex:none;font-size:12px;color:#8a8a8a;padding:6px 0}
#md{position:fixed;inset:0;background:#000c;display:none;z-index:60;align-items:center;justify-content:center;padding:12px}
#mc{width:100%;max-width:420px;max-height:90vh;overflow:auto;background:#1a1a1a;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
#mc video,#mc img{width:100%;max-height:30vh;object-fit:contain;background:#000;border-radius:8px}
#mc audio{width:100%}
.row{display:flex;gap:8px;align-items:center}.row button{flex:1}
.wr{color:#f0b429;font-size:12px}
input[type=range]{accent-color:#4fd1e5}
#mc select{height:40px;border:0;border-radius:10px;background:#2a2a2a;color:#fff;padding:0 10px;font:inherit}
#mc input[type=file]{height:auto;padding:8px}
#cv{touch-action:none}
.sl{display:grid;grid-template-columns:84px 1fr 40px auto;gap:6px;align-items:center;margin:4px 0;font-size:12px}
.sl b{font-weight:400;text-align:right}
/* ===== Отдельный режим 3D ===== */
#e3{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;background:#1a1a1a;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.m3 #e3{display:flex}
#e3v{flex:1;min-height:0;position:relative;touch-action:none;overflow:hidden;background:#2b2b2b}
#e3v canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#e3t{position:absolute;top:6px;left:6px;right:6px;display:flex;gap:4px;align-items:center;z-index:2}
#e3l{background:#1a1a1ad0;border-radius:12px}
#e3p{flex:none;height:52px;display:flex;align-items:center;gap:8px;padding:0 8px;background:#1a1a1a}
#e3p input{flex:1}
#e3m{font-size:12px;color:#8a8a8a;white-space:nowrap}
#e3b{flex:none;height:72px;display:flex;gap:4px;overflow-x:auto;padding:4px;background:#0d0d0d;scrollbar-width:none}
#e3b button{flex:none;width:72px;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;color:#fff;background:none}
#e3b button b{display:flex;font-weight:400}
.m3 #sh{z-index:31}#e3q{position:absolute;top:52px;left:6px;width:230px;max-height:55%;overflow:auto;background:#1a1a1af0;border-radius:12px;padding:6px;display:none;z-index:3}#e3q.open{display:block}#e3q .r{display:flex;align-items:center;gap:2px;margin:2px 0}#e3q .r button{min-height:38px}#e3q .n{flex:1;text-align:left;padding:0 10px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}#e3q .n.on{background:var(--ac);color:#000}.m3 #md{z-index:40}.m3 #toast{z-index:50}
</style></head><body>
<div id="app">
 <div id="top"><div><button class='ib' id='cls'><i data-i='close'></i></button><button class='ib' id='sr'><i data-i='search'></i></button></div><div><button id='rs'></button><button id='exp'>Экспорт</button></div></div>
 <div id="pv"><canvas id="cv"></canvas></div>
 <div id='ctl'><div><button class='ib' id='fs'><i data-i='full'></i></button><span id='tm'><b>00:00</b> / 00:00</span></div><button id='play'><i data-i='play' data-s='28'></i></button><div><button class='ib' id='sn'><i data-i='magnet'></i><span>ON</span></button><button class='ib' id='un'><i data-i='undo'></i></button><button class='ib' id='re'><i data-i='redo'></i></button></div></div>
 <div id="tl"><div id='lbl'><button class='ib' id='mu'><i data-i='vol'></i><span>Выкл. звук</span></button><div id='cov'><i data-i='pen' data-s='16'></i><span>Обложка</span></div></div><div id="area"><canvas id="rl"></canvas><div id="lw"><div id="lane"></div></div></div><div id="ph"></div></div>
 <div id="tb"></div>
</div>
<div id="sh"><div id="grip"></div><div id="shh"></div><div id="shb"></div><div id='shf'><button class='ib' id='no'><i data-i='close'></i></button><button class='ib' id='ok'><i data-i='check'></i></button></div></div>
<div id='lib'><div id='lh'><input id='lq' placeholder='Поиск: название, фраза, теги'><button class='ib' id='la'><i data-i='plus'></i></button><button class='ib' id='lx'><i data-i='close'></i></button></div><div id='lch'></div><div id='lg'></div><div id='ls'></div></div>
<div id='md'><div id='mc'></div></div>
<div id='e3'><div id='e3v'><div id='e3t'><button class='ib' id='e3h'><i data-i='home'></i></button><button class='ib' id='e3o'><i data-i='chev'></i></button><button class='ib' id='e3u'><i data-i='undo'></i></button><button class='ib' id='e3r'><i data-i='redo'></i></button><span style='flex:1'></span><button class='ib' id='e3z'><i data-i='refresh'></i></button><button class='ib' id='e3l'><i data-i='list'></i></button></div><div id='e3q'></div></div><div id='e3p'><button class='ib' id='e3pl'><i data-i='play' data-s='28'></i></button><span id='e3m'>00:00 / 00:00</span><input type='range' id='e3s' min='0' max='1' step='.001'></div><div id='e3b'></div></div>
<input type='file' id='lf' multiple accept='video/*,image/*' hidden>
<div id="toast"></div>
<input type="file" id="file" multiple accept="video/*,image/*" hidden>
<script>
// ===== 1. Данные проекта (всё хранится в памяти) =====
const $=id=>document.getElementById(id);
const cv=$('cv'),cx=cv.getContext('2d'),A=$('area');
// media — загруженные файлы; els — по одному video/audio на клип; clips — клипы на дорожках
let media={},els={},clips=[],sel=null,t=0,pps=60,playing=false,ratio=[9,16],res=720,nid=1,addTrack=0,g=null;
// Дорожки: 0 основная, 1 наложение, 2 аудио, 3 текст, 4 эффекты
let Y={},muted=false,snapOn=true,vy=0,CH=0; // vy — прокрутка таймлайна вниз, CH — высота всех строк // Y — высота строк таймлайна
// Иконки: только линейные SVG, белые, stroke 1.8, 24x24
const IC={
close:`<path d='M6 6l12 12M18 6L6 18'/>`,search:`<circle cx='11' cy='11' r='6.5'/><path d='M16 16l4.5 4.5'/>`,chev:`<path d='M6 9l6 6 6-6'/>`,
full:`<path d='M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5'/>`,play:`<path d='M8 5l11 7-11 7z'/>`,
pause:`<rect x='6' y='5' width='4' height='14' rx='1'/><rect x='14' y='5' width='4' height='14' rx='1'/>`,
magnet:`<path d='M6 3v9a6 6 0 0 0 12 0V3h-4v9a2 2 0 0 1-4 0V3z'/><path d='M6 7h4M14 7h4'/>`,
undo:`<path d='M9 14L4 9l5-5'/><path d='M4 9h10a6 6 0 0 1 0 12h-3'/>`,redo:`<path d='M15 14l5-5-5-5'/><path d='M20 9H10a6 6 0 0 0 0 12h3'/>`,
vol:`<path d='M4 9v6h4l5 4V5L8 9z'/><path d='M16.5 9a4 4 0 0 1 0 6'/>`,pen:`<path d='M4 20l1-4L16 5l3 3L8 19z'/><path d='M14 7l3 3'/>`,
plus:`<path d='M12 5v14M5 12h14'/>`,check:`<path d='M5 12l5 5 9-10'/>`,back:`<path d='M15 5l-7 7 7 7'/>`,
cut:`<circle cx='6' cy='6' r='2.5'/><circle cx='6' cy='18' r='2.5'/><path d='M8 7.5L20 18M8 16.5L20 6'/>`,
note:`<path d='M9 18V5l11-2v13'/><circle cx='6.5' cy='18' r='2.5'/><circle cx='17.5' cy='16' r='2.5'/>`,
text:`<path d='M5 6V4h14v2M12 4v16M9 20h6'/>`,layers:`<path d='M12 3l9 5-9 5-9-5z'/><path d='M3 13l9 5 9-5'/>`,
spark:`<path d='M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z'/>`,filter:`<circle cx='9' cy='12' r='5.5'/><circle cx='15' cy='12' r='5.5'/>`,
sub:`<rect x='3' y='5' width='18' height='14' rx='3'/><path d='M7 11h6M7 15h10'/>`,
cube:`<path d='M12 3l8 4.5v9L12 21l-8-4.5v-9z'/><path d='M12 12l8-4.5M12 12v9M12 12L4 7.5'/>`,
cam:`<rect x='3' y='7' width='13' height='10' rx='2'/><path d='M16 11l5-3v8l-5-3'/>`,keys:`<rect x='3' y='5' width='18' height='14' rx='2'/><path d='M9 5v14M15 5v14'/>`,
frame:`<path d='M7 3v14h14M3 7h14v14'/>`,speed:`<path d='M4 17a8 8 0 1 1 16 0'/><path d='M12 17l4-5'/>`,
wave:`<path d='M3 17c4 0 4-10 9-10s5 10 9 10'/>`,drop:`<path d='M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z'/>`,
mask:`<circle cx='12' cy='12' r='8'/><path d='M12 4a8 8 0 0 1 0 16z'/>`,
blend:`<rect x='3' y='3' width='12' height='12' rx='2'/><rect x='9' y='9' width='12' height='12' rx='2'/>`,
dup:`<rect x='8' y='8' width='12' height='12' rx='2'/><path d='M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2'/>`,
trash:`<path d='M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3'/>`,
snow:`<path d='M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9'/>`,
home:`<path d='M4 11l8-7 8 7M6 10v10h12V10'/>`,list:`<path d='M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01'/>`,
refresh:`<path d='M20 11a8 8 0 0 0-14-4M4 4v4h4M4 13a8 8 0 0 0 14 4M20 20v-4h-4'/>`,sky:`<path d='M6 18a4 4 0 0 1 1-8 6 6 0 0 1 11 2 3 3 0 0 1 0 6z'/>`,
img:`<rect x='3' y='5' width='18' height='14' rx='2'/><circle cx='9' cy='10' r='1.5'/><path d='M21 16l-5-5-9 8'/>`,bulb:`<path d='M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10c1 1 1 2 1 3h6c0-1 0-2 1-3a6 6 0 0 0-4-10z'/>`,
star:`<path d='M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z'/>`,folder:`<path d='M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z'/>`};
IC.up=`<path d='M12 19V5M6 11l6-6 6 6'/>`;IC.down=`<path d='M12 5v14M6 13l6 6 6-6'/>`;
const ic=(n,s=24,c='#fff')=>`<svg width='${s}' height='${s}' viewBox='0 0 24 24' fill='none' stroke='${c}' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'>${IC[n]}</svg>`;
const fmt=s=>{s=Math.max(0,s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0')};
const total=()=>clips.reduce((m,c)=>Math.max(m,c.start+c.dur),0);

// ===== 2. Сообщения об ошибках внизу экрана =====
let tt;function toast(m){const e=$('toast');e.textContent=m;e.style.opacity=1;clearTimeout(tt);tt=setTimeout(()=>e.style.opacity=0,3000);}
window.onerror=m=>toast('Ошибка: '+m);
window.onunhandledrejection=e=>toast('Ошибка: '+((e.reason&&e.reason.message)||e.reason));

// ===== 3. Отмена и повтор (стек состояний, без лимита) =====
const hist=[];let hi=-1;
const ST=()=>JSON.stringify({clips,ratio});
function save(){const s=ST();if(s===hist[hi])return;hist.length=hi+1;hist.push(s);hi++;pSave();}
function restore(){const o=JSON.parse(hist[hi]);clips=o.clips;ratio=o.ratio;sel=null;fitCanvas();build();}
function undo(){if(hi>0){hi--;restore();}else toast('Нечего отменять');}
function redo(){if(hi<hist.length-1){hi++;restore();}}

// ===== 4. Загрузка файлов =====
const once=(el,ev)=>new Promise((ok,no)=>{el.addEventListener(ev,ok,{once:true});el.addEventListener('error',()=>no(new Error('err')),{once:true});});
async function thumb(v){ // миниатюра из кадра видео
  v.currentTime=Math.min(.1,v.duration/2);
  await Promise.race([once(v,'seeked'),new Promise(r=>setTimeout(r,2000))]);
  const c=document.createElement('canvas');c.width=80;c.height=Math.round(80*v.videoHeight/v.videoWidth)||45;
  try{c.getContext('2d').drawImage(v,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.7);}catch(e){return '';}
}
async function addFiles(fs){
  for(const f of fs){try{
    const type=f.type.split('/')[0];

}

// --- Поиск: без регистра, е=ё, часть слова, опечатки (расстояние Левенштейна) ---
const norm=s=>String(s||'').toLowerCase().replace(/ё/g,'е');
function lev(a,b){const d=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const x=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=x;}}return d[b.length];}
function hit(w,text){text=norm(text);if(text.includes(w))return true;if(w.length<4)return false;const lim=w.length<7?1:2;
  return text.split(/[^a-zа-я0-9]+/).some(x=>x.length>=w.length-lim&&lev(w,x.slice(0,w.length))<=lim);}
function results(){
  const qs=norm($('lq').value).split(/\s+/).filter(Boolean),out=[];
  const ok=it=>fl==='fav'?it.fav:fl==='chroma'?it.chroma:fl==='recent'?it.used:['video','audio','image'].includes(fl)?it.type===fl:fl.startsWith('t:')?it.tags.includes(fl.slice(2)):fl.startsWith('f:')?it.folder===fl.slice(2):true;
  for(const it of items){if(!ok(it))continue;
    if(qs.every(w=>hit(w,it.name+' '+it.say+' '+it.tags.join(' '))))out.push({it});
    if(qs.length)it.marks.forEach(mk=>{if(qs.every(w=>hit(w,mk.name)))out.push({it,mk});}); // метки ищутся наравне с футажами
  }
  if(fl==='recent')return out.sort((a,b)=>b.it.used-a.it.used).slice(0,10);
  return out.sort((a,b)=>b.it.added-a.it.added);
}

function keyed(c,e,sw,sh){ // убираем выбранный цвет попиксельно, край сглаживаем, зелёную кайму гасим
  const s=Math.min(1,320/Math.max(sw,sh)),w=Math.round(sw*s),h=Math.round(sh*s),k=kc[c.id]||(kc[c.id]=document.createElement('canvas'));

// ===== Этап 8: экспорт в MP4/WebM со звуком, кнопка «Экспорт» показывает прогресс и отменяет =====
async function saveFile(name,data){
  try{const d=window.claude&&await claude.use('downloads');
    if(d){await d.save({filename:name,data});toast('Готово: '+name);return;}}
  catch(e){toast(e&&e.code==='declined'?'Сохранение отменено':e&&e.code==='rejected_extension'?'Этот формат нельзя сохранить из опубликованной страницы (в файле на устройстве работает)':'Не удалось сохранить: '+((e&&e.message)||e));return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(data);a.download=name;a.click();toast('Готово: '+name); // обычный запуск файла
}
async function exportVideo(){
  if(rec){stopped=true;rec.stop();return;} // повторное нажатие = отмена
  if(!total())return toast('Нечего экспортировать: добавь клипы');
  if(!window.MediaRecorder||!cv.captureStream)return toast('Этот браузер не умеет записывать видео');
  const mt=['video/mp4','video/webm;codecs=vp9,opus','video/webm'].find(x=>MediaRecorder.isTypeSupported(x));
  if(!mt)return toast('Формат записи не поддерживается');
  const ext=mt.startsWith('video/mp4')?'mp4':'webm';
  if(ext==='webm')toast('MP4 здесь не поддерживается, сохраню WebM');
  pause();t=0;const mu=muted;muted=false;stopped=false;
  const stream=cv.captureStream(30);
  try{ // звук всех клипов собираем в один поток
    AC=AC||new AudioContext();await AC.resume();const dst=AC.createMediaStreamDestination();
    clips.forEach(c=>{const m=media[c.m];if(!m||m.type==='image')return;const e=el(c);if(!e.srcNode){e.srcNode=AC.createMediaElementSource(e);e.srcNode.connect(AC.destination);}e.srcNode.connect(dst);});
    dst.stream.getAudioTracks().forEach(a=>stream.addTrack(a));
  }catch(e){toast('Звук подключить не удалось, запишу без звука');}
  const parts=[];rec=new MediaRecorder(stream,{mimeType:mt,videoBitsPerSecond:res===1080?8e6:5e6});
  rec.ondataavailable=e=>{if(e.data.size)parts.push(e.data);};
  const iv=setInterval(()=>{$('exp').textContent=Math.round(t/total()*100)+'% · отмена';if(!playing)rec.stop();},250);
  rec.onstop=()=>{clearInterval(iv);rec=null;muted=mu;pause();$('exp').textContent='Экспорт';if(!stopped)saveFile('video.'+ext,new Blob(parts,{type:mt}));else toast('Экспорт отменён');};
  rec.start(500);toggle();
}

function r3(c,W,H){ // рисуем сцену в момент t и отдаём холст

  const f=1-cm.sm; // сглаживание движения камеры
  if(!K.init||f>=1){cam.position.copy(tp);cam.quaternion.copy(tq);K.init=1;}else{cam.position.lerp(tp,f);cam.quaternion.slerp(tq,f);}
  K.scene.background=S.sky?new THREE.Color(S.sky):null;R3.render(K.scene,cam);return R3.domElement;
}

function homeShow(){
  pause();pFlush();let h=$('home');if(!h){h=document.createElement('div');h.id='home';document.body.appendChild(h);}
  h.innerHTML="<h1>Проекты</h1><button id='hn'>＋ Новый проект</button><div id='hl'></div>";
  const L=pidx.filter(e=>e.n>0||e.id===pid).sort((a,b)=>b.ts-a.ts);
  if(!L.length)$('hl').innerHTML="<div style='opacity:.5'>Пока пусто</div>";
  L.forEach(e=>{
    const r=document.createElement('div');r.className='row';r.style.marginBottom='10px';
    const b=document.createElement('button');b.className='pc';b.style.cssText='flex:1;width:auto;margin:0';
    b.innerHTML=(e.thumb?"<img src='"+e.thumb+"'>":"<div class='ph0'></div>")+"<div><b></b>"+(e.id===pid?' ✓':'')+"<br><span style='opacity:.6'>"+e.n+" клипов · "+(+e.dur).toFixed(1)+" с</span></div>";
    b.querySelector('b').textContent=e.name;
    b.onclick=()=>{if(e.id===pid)h.classList.remove('open');else openProj(e.id).then(()=>h.classList.remove('open'));};
    const rn=document.createElement('button');rn.className='ib';rn.innerHTML=ic('pen',20);
    rn.onclick=()=>ask('Название проекта',e.name,v=>{e.name=v;if(e.id===pid)pname=v;if(pdb)try{pdb.transaction('p','readwrite').objectStore('p').put(pidx,'idx');}catch(x){}homeShow();});
    const dl=document.createElement('button');dl.className='ib';dl.innerHTML=ic('trash',20);let sure=0;
    dl.onclick=()=>{if(!sure){sure=1;dl.innerHTML='<span style="font-size:12px;color:#f66">Удалить?</span>';return;}
      if(e.id===pid){resetProj();pid='p'+Date.now();pname='Проект '+(pidx.length);projDel(e.id);save();fitCanvas();build();}else projDel(e.id);homeShow();};
    r.append(b,rn,dl);$('hl').append(r);
  });
  h.classList.add('open');
  $('hn').onclick=()=>{if(clips.length)newProj();h.classList.remove('open');};
}
